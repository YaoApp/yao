group: utils.app
type: process
desc: "Utility and app bootstrap processes for health checks and system inspection"
entries:
  # ── utils.app (current) ──────────────────────────────────────────
  - name: Ping
    desc: Return engine name, version, and application root path
    args: []
    return:
      type: object
      desc: "Object with engine, version, and root fields"

  - name: Inspect
    desc: Return detailed system information including version, CUI, build name, config, and external tools
    args: []
    return:
      type: object
      desc: "Object with VERSION, CUI, BUILDNAME, CONFIG, and optionally TOOLS fields"

  # ── xiang.main (deprecated, aliased to utils.app) ───────────────
  - name: Ping
    group: xiang.main
    desc: "[Deprecated: use utils.app.Ping] Return engine name, version, and application root path"
    args: []
    return:
      type: object
      desc: "Object with engine, version, and root fields"

  - name: Inspect
    group: xiang.main
    desc: "[Deprecated: use utils.app.Inspect] Return detailed system information"
    args: []
    return:
      type: object
      desc: "Object with VERSION, CUI, BUILDNAME, CONFIG, and optionally TOOLS fields"

  - name: Favicon
    group: xiang.main
    desc: "[Deprecated] Return the application favicon (currently returns null)"
    args: []
    return:
      type: "null"
      desc: "Always returns null"

  - name: FileContent
    group: xiang.main
    desc: "[Deprecated] Return file content from storage (currently returns null)"
    args:
      - name: filename
        type: string
        required: false
        desc: "File path to read (handler is disabled)"
      - name: encode
        type: bool
        required: false
        desc: "Whether to base64 encode the content (handler is disabled)"
    return:
      type: "null"
      desc: "Always returns null"

  - name: AppFileContent
    group: xiang.main
    desc: "[Deprecated] Return application data file content (currently returns null)"
    args:
      - name: filename
        type: string
        required: false
        desc: "Application data file path to read (handler is disabled)"
      - name: encode
        type: bool
        required: false
        desc: "Whether to base64 encode the content (handler is disabled)"
    return:
      type: "null"
      desc: "Always returns null"

  # ── xiang.sys (deprecated aliases) ──────────────────────────────
  - name: Ping
    group: xiang.sys
    desc: "[Deprecated: use utils.app.Ping] Alias of xiang.main.Ping"
    args: []
    return:
      type: object
      desc: "Object with engine, version, and root fields"

  - name: Inspect
    group: xiang.sys
    desc: "[Deprecated: use utils.app.Inspect] Alias of xiang.main.Inspect"
    args: []
    return:
      type: object
      desc: "Object with VERSION, CUI, BUILDNAME, CONFIG, and optionally TOOLS fields"

  # ── yao.app (migrated from widgets/app) ─────────────────────────
  - name: setting
    group: yao.app
    desc: Return the application DSL settings with i18n translation applied
    args:
      - name: payload
        type: object
        required: false
        desc: "Optional object with sid (session ID), lang (language code e.g. \"en-us\"), and now (unix timestamp)"
    return:
      type: object
      desc: "Application DSL object with name, version, description, theme, lang, menu, optional, sid, logo, and favicon fields"

  - name: xgen
    group: yao.app
    desc: Return the merged Xgen settings including app config, agent config, tools, and knowledge base
    args:
      - name: payload
        type: object
        required: false
        desc: "Optional object with sid (session ID), lang (language code e.g. \"en-us\"), and now (unix timestamp)"
    return:
      type: object
      desc: "Xgen settings object with name, description, version, yao, cui, theme, lang, mode, apiPrefix, token, optional, login, agent, tools, openapi, kb, logo, favicon, and sid fields"

  - name: menu
    group: yao.app
    desc: Return the application menu list by delegating to the configured menu.process
    args:
      - name: args
        type: any
        required: false
        desc: "Arguments forwarded to the configured menu process"
    return:
      type: any
      desc: "Menu data returned by the configured menu process"

  - name: icons
    group: yao.app
    desc: Return the content of an application icon file from the icons/ directory
    args:
      - name: name
        type: string
        required: true
        desc: "Icon filename (e.g. \"app.ico\", \"app.png\")"
    return:
      type: string
      desc: "Icon file content as string"

  - name: setup
    group: yao.app
    desc: Run the application setup process and return home/admin URLs with translated settings
    args:
      - name: payload
        type: object
        required: true
        desc: "Setup payload object; may include sid (session ID); include 'error' key to trigger a test error"
    return:
      type: object
      desc: "Object with home (string URL), admin (string URL), and setting (translated app DSL)"

  - name: check
    group: yao.app
    desc: Run the application check process for setup validation
    args:
      - name: payload
        type: object
        required: true
        desc: "Check payload object; include 'error' key to trigger a test error"
    return:
      type: "null"
      desc: "Returns null on success, throws exception on error"

  - name: service
    group: yao.app
    desc: Call a named application service script method with arguments
    args:
      - name: name
        type: string
        required: true
        desc: "Service script name (resolves to __yao_service.<name> V8 script)"
      - name: payload
        type: object
        required: true
        desc: "Object with method (string, required) and args (array, optional) fields"
    return:
      type: any
      desc: "Return value from the service method call"
