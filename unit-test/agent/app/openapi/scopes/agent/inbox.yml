# Inbox - Agent Inbox/Mail Management (Task-based)
# namespace: agent
# resource: inbox
# actions: read, write, delete
# levels: all, own, team

# ============ Read Permissions ============

agent:inbox:read:all:
  description: "Read all inbox messages"
  endpoints:
    - GET /agent/inbox
    - GET /agent/inbox/stats
    - GET /agent/inbox/unread-count

agent:inbox:read:own:
  owner: true
  description: "Read own inbox messages"
  endpoints:
    - GET /agent/inbox
    - GET /agent/inbox/stats
    - GET /agent/inbox/unread-count

agent:inbox:read:team:
  team: true
  description: "Read team inbox messages"
  endpoints:
    - GET /agent/inbox
    - GET /agent/inbox/stats
    - GET /agent/inbox/unread-count

# ============ Write Permissions ============

agent:inbox:write:all:
  description: "Update all inbox tasks (view, bookmark, pin, read-all)"
  endpoints:
    - PUT /agent/inbox/view/:chat_id
    - PUT /agent/inbox/read-all
    - PUT /agent/inbox/bookmark/:chat_id
    - PUT /agent/inbox/unbookmark/:chat_id
    - PUT /agent/inbox/pin/:chat_id
    - PUT /agent/inbox/unpin/:chat_id

agent:inbox:write:own:
  owner: true
  description: "Update own inbox tasks (view, bookmark, pin, read-all)"
  endpoints:
    - PUT /agent/inbox/view/:chat_id
    - PUT /agent/inbox/read-all
    - PUT /agent/inbox/bookmark/:chat_id
    - PUT /agent/inbox/unbookmark/:chat_id
    - PUT /agent/inbox/pin/:chat_id
    - PUT /agent/inbox/unpin/:chat_id

agent:inbox:write:team:
  team: true
  description: "Update team inbox tasks (view, bookmark, pin, read-all)"
  endpoints:
    - PUT /agent/inbox/view/:chat_id
    - PUT /agent/inbox/read-all
    - PUT /agent/inbox/bookmark/:chat_id
    - PUT /agent/inbox/unbookmark/:chat_id
    - PUT /agent/inbox/pin/:chat_id
    - PUT /agent/inbox/unpin/:chat_id

# ============ Delete Permissions ============

agent:inbox:delete:all:
  description: "Delete inbox messages by chat"
  endpoints:
    - DELETE /agent/inbox/chat/:chat_id

agent:inbox:delete:own:
  owner: true
  description: "Delete own inbox messages by chat"
  endpoints:
    - DELETE /agent/inbox/chat/:chat_id

agent:inbox:delete:team:
  team: true
  description: "Delete team inbox messages by chat"
  endpoints:
    - DELETE /agent/inbox/chat/:chat_id
