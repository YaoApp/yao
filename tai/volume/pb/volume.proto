syntax = "proto3";
package volume;
option go_package = "github.com/yaoapp/yao/tai/volume/pb";

// Volume provides bulk file synchronization, real-time filesystem I/O,
// and archive/compression operations.
// Shares gRPC port :19100 with Yao Gateway.
service Volume {

  // --- Bulk Sync ---

  // SyncPush: Yao sends code to Tai (before container start).
  // Bidirectional stream:
  //   1. Yao sends SyncManifest (file list with mtime+size)
  //   2. Tai diffs, replies with SyncDiff (which files to send)
  //   3. Yao sends only needed FileChunks
  //   4. Tai replies with SyncResult
  rpc SyncPush(stream SyncMessage) returns (stream SyncMessage);

  // SyncPull: Yao pulls changes from Tai (after container stop).
  // Yao sends its file manifest; Tai diffs internally and streams back changed files.
  rpc SyncPull(SyncManifest) returns (stream SyncMessage);

  // --- Real-Time FS IO ---

  rpc ReadFile(FSReadRequest) returns (stream FSDataChunk);
  rpc WriteFile(stream FSWriteChunk) returns (FSWriteResponse);
  rpc Stat(FSRequest) returns (FileInfo);
  rpc ListDir(FSRequest) returns (FSListResponse);
  rpc Remove(FSRemoveRequest) returns (FSOpResponse);
  rpc Rename(FSRenameRequest) returns (FSOpResponse);
  rpc MkdirAll(FSRequest) returns (FSOpResponse);
  // Abs: resolve a session-relative path to its absolute path on the host.
  rpc Abs(FSRequest) returns (FSAbsResponse);
  // Copy: copy src to dst within the same workspace (server-side when remote).
  rpc Copy(FSCopyRequest) returns (SyncResult);

  // --- Skills Discovery ---

  rpc ListSkills(FSRequest) returns (ListSkillsResponse);

  // --- Archive / Compression ---

  rpc Zip(ArchiveRequest) returns (ArchiveResponse);
  rpc Unzip(ArchiveRequest) returns (ArchiveResponse);
  rpc Gzip(ArchiveRequest) returns (ArchiveResponse);
  rpc Gunzip(ArchiveRequest) returns (ArchiveResponse);
  rpc Tar(ArchiveRequest) returns (ArchiveResponse);
  rpc Untar(ArchiveRequest) returns (ArchiveResponse);
  rpc Tgz(ArchiveRequest) returns (ArchiveResponse);
  rpc Untgz(ArchiveRequest) returns (ArchiveResponse);

  // --- Git ---

  // Read-only
  rpc GitListRepos(FSRequest) returns (GitReposResponse);
  rpc GitStatus(GitStatusRequest) returns (GitStatusResponse);
  rpc GitFileDiff(GitFileDiffRequest) returns (GitFileDiffResponse);

  // Write operations
  rpc GitAdd(GitAddRequest) returns (GitOpResponse);
  rpc GitReset(GitResetRequest) returns (GitOpResponse);
  rpc GitCommit(GitCommitRequest) returns (GitCommitResponse);
  rpc GitDiscardChanges(GitDiscardRequest) returns (GitOpResponse);
}

// --- File Metadata ---

message FileInfo {
  string path   = 1;
  int64  size   = 2;
  int64  mtime  = 3;           // unix timestamp (nanoseconds)
  uint32 mode   = 4;
  bool   is_dir = 5;
}

// --- Sync Messages ---

message SyncManifest {
  string session_id       = 1;
  repeated FileInfo files = 2;
  bool   force_full       = 3;  // skip snapshot cache, diff against actual disk
  string remote_path      = 4;  // sub-path within workspace root; empty = root
}

message SyncMessage {
  oneof payload {
    SyncManifest manifest = 1;
    SyncDiff     diff     = 2;
    FileChunk    chunk    = 3;
    SyncResult   result   = 4;
  }
}

message SyncDiff {
  repeated string need_files   = 1;  // paths needing full transfer
  repeated string delete_files = 2;  // paths Tai should delete
}

message FileChunk {
  string    path  = 1;
  ChunkType type  = 2;
  bytes     data  = 3;          // lz4 compressed (V1: always FULL)
  uint32    mode  = 4;          // file mode (first chunk only)
  int64     mtime = 5;          // modification time (first chunk only)
  bool      eof   = 6;

  enum ChunkType {
    FULL   = 0;
    DELTA  = 1;                 // reserved for future rsync delta
    DELETE = 2;
    MKDIR  = 3;
  }
}

message SyncResult {
  int32 files_synced      = 1;
  int64 bytes_transferred = 2;
  int64 duration_ms       = 3;
}

// --- FS IO Messages ---

message FSRequest {
  string session_id = 1;
  string path       = 2;
}

message FSOpResponse {
  bool   ok    = 1;
  string error = 2;
}

message FSAbsResponse {
  string path = 1;              // absolute path on the host filesystem
}

message FSReadRequest {
  string session_id = 1;
  string path       = 2;
}

message FSDataChunk {
  bytes  data  = 1;             // up to 64KB per message
  uint32 mode  = 2;             // first chunk only
  int64  size  = 3;             // total file size (first chunk only)
  int64  mtime = 4;             // modification time (first chunk only)
}

message FSWriteChunk {
  string session_id  = 1;       // first chunk only
  string path        = 2;       // first chunk only
  bytes  data        = 3;
  uint32 mode        = 4;       // first chunk only, 0 = keep existing
  bool   create_dirs = 5;       // auto-create parent directories (first chunk only)
}

message FSWriteResponse {
  int64 size = 1;
}

message FSListResponse {
  repeated FileInfo entries = 1;
}

message FSRemoveRequest {
  string session_id = 1;
  string path       = 2;
  bool   recursive  = 3;       // true = RemoveAll, false = Remove
}

message FSRenameRequest {
  string session_id = 1;
  string old_path   = 2;
  string new_path   = 3;
}

message FSCopyRequest {
  string session_id       = 1;
  string src_path         = 2;
  string dst_path         = 3;
  repeated string excludes = 4;  // glob patterns
  bool force              = 5;   // overwrite even if mtime/size match
}

// --- Archive / Compression Messages ---

message ArchiveRequest {
  string session_id      = 1;
  string src_path        = 2;  // relative to workspace root
  string dst_path        = 3;  // relative to workspace root
  repeated string excludes = 4; // glob patterns (pack ops only)
}

message ArchiveResponse {
  int64 size_bytes  = 1;  // output file size (pack) or total extracted size (unpack)
  int32 files_count = 2;  // number of files processed
}

// --- Skills Discovery Messages ---

message SkillEntry {
  string name        = 1;
  string description = 2;
  string path        = 3;  // relative to session root
}

message ListSkillsResponse {
  repeated SkillEntry skills = 1;
}

// --- Git Messages ---

message GitRepo {
  string path       = 1;  // relative to workspace root, e.g. "app/backend"
  string branch     = 2;  // current branch name
  string remote_url = 3;  // origin remote URL
  bool has_changes  = 4;  // has uncommitted changes
}

message GitReposResponse {
  repeated GitRepo repos = 1;
}

message GitStatusRequest {
  string session_id = 1;
  string repo_path  = 2;  // repo path relative to workspace root
}

// git status --porcelain format: XY path
// X = index (staged) status, Y = worktree (unstaged) status
// A single file can have both staged and unstaged changes (partial staging)
message GitChangedFile {
  string path            = 1;  // file path relative to repo root
  string index_status    = 2;  // staged status: " "/M/A/D/R/C/U
  string worktree_status = 3;  // unstaged status: " "/M/D/?/U
  string old_path        = 4;  // only set for Renamed (original path)
}
// Note: U = UpdatedButUnmerged (merge conflict)

message GitStatusResponse {
  string branch                  = 1;
  repeated GitChangedFile files  = 2;
  int32 ahead                    = 3;
  int32 behind                   = 4;
  int32 total_insertions         = 5;  // staged + unstaged combined
  int32 total_deletions          = 6;
  bool is_detached               = 7;  // HEAD detached (checked out to commit), branch = commit hash prefix
  bool is_empty                  = 8;  // empty repo (no commits)
}

message GitFileDiffRequest {
  string session_id = 1;
  string repo_path  = 2;
  string file_path  = 3;
  bool staged       = 4;  // true=staged diff, false=unstaged diff
}

message GitFileDiffResponse {
  string original    = 1;  // HEAD content (staged) or index content (unstaged)
  string modified    = 2;  // index content (staged) or worktree content (unstaged)
  string language    = 3;  // file language inferred from extension
  bool is_binary     = 4;
  bool is_new        = 5;  // new file (no original)
  bool is_deleted    = 6;  // deleted file (no modified)
  bool is_too_large  = 7;  // file too large (>5MB), content not returned
}

// --- Git Write Operation Messages ---

message GitAddRequest {
  string session_id       = 1;
  string repo_path        = 2;
  repeated string files   = 3;  // file paths relative to repo root; empty = add all
}

message GitResetRequest {
  string session_id       = 1;
  string repo_path        = 2;
  repeated string files   = 3;  // file paths relative to repo root; empty = unstage all
}

message GitCommitRequest {
  string session_id  = 1;
  string repo_path   = 2;
  string message     = 3;       // required, must not be empty
  bool allow_empty   = 4;       // allow empty commit (no staged changes)
  string author_name = 5;       // optional; empty = read from git config, fallback "Yao Workspace"
  string author_email = 6;      // optional; empty = read from git config, fallback "workspace@yao.run"
}

message GitDiscardRequest {
  string session_id       = 1;
  string repo_path        = 2;
  repeated string files   = 3;  // file paths relative to repo root; empty = discard all
}

message GitOpResponse {
  bool success   = 1;
  string message = 2;  // error message or operation summary
}

message GitCommitResponse {
  bool success      = 1;
  string commit_hash = 2;  // new commit SHA
  string message    = 3;
}
