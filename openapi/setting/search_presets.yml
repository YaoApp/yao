# Search & Scrape provider presets.
# Embedded at compile time via go:embed in search.go.

- key: tao
  name: Tao Service
  description:
    zh-CN: "Tao Service 提供的搜索与抓取能力，凭证来自 Tao Service 配置页"
    en-US: "Search & scrape powered by Tao Service, credentials from Tao Service config"
  website: "https://yaoagents.com/tao"
  tools: [web_search, web_scrape]
  tool_labels:
    - { zh-CN: "网页搜索", en-US: "Web Search" }
    - { zh-CN: "网页抓取", en-US: "Web Scrape" }
  fields: []
  is_cloud: true

- key: tavily
  name: Tavily
  description:
    zh-CN: "AI 优化的搜索 API，返回结构化结果，适合 Agent 使用"
    en-US: "AI-optimized search API with structured results, ideal for agents"
  website: "https://tavily.com"
  tools: [web_search]
  tool_labels:
    - { zh-CN: "网页搜索", en-US: "Web Search" }
  fields:
    - key: api_key
      label: { zh-CN: "API Key", en-US: "API Key" }
      type: password

- key: serper
  name: "Serper (Google)"
  description:
    zh-CN: "基于 Google 搜索的 API，价格实惠，结果质量高"
    en-US: "Google Search API with affordable pricing and high-quality results"
  website: "https://serper.dev"
  tools: [web_search]
  tool_labels:
    - { zh-CN: "网页搜索", en-US: "Web Search" }
  fields:
    - key: api_key
      label: { zh-CN: "API Key", en-US: "API Key" }
      type: password

- key: brightdata
  name: Brightdata
  description:
    zh-CN: "部分网站有访问限制，启用代理可提升抓取成功率。需开通 Web Access API (Web Unlocker)。"
    en-US: "Some websites have access restrictions. Enabling proxy improves scraping success rate. Requires Web Access API (Web Unlocker)."
  website: "https://brightdata.com"
  tools: [web_scrape]
  tool_labels:
    - { zh-CN: "网页抓取", en-US: "Web Scrape" }
  fields:
    - key: api_key
      label: { zh-CN: "API Key", en-US: "API Key" }
      type: password
    - key: zone
      label: { zh-CN: "Zone", en-US: "Zone" }
      type: text
      hint: { zh-CN: "Web Unlocker API 的 Zone 名称", en-US: "Zone name of your Web Unlocker API" }

- key: direct
  name: Direct
  description:
    zh-CN: "直接抓取，不使用代理"
    en-US: "Direct fetch without proxy"
  tools: [web_scrape]
  tool_labels:
    - { zh-CN: "网页抓取", en-US: "Web Scrape" }
  fields: []

- key: parallel
  name: Parallel
  description:
    zh-CN: "通过 Search MCP 搜索，无需账户或 API Key。查询发送给 Parallel，免费访问有速率限制。"
    en-US: "Search MCP without an account or API key. Queries are sent to Parallel; free access is rate limited."
  website: "https://docs.parallel.ai/integrations/mcp/search-mcp"
  tools: [web_search]
  tool_labels:
    - { zh-CN: "网页搜索", en-US: "Web Search" }
  fields:
    - key: api_key
      label: { zh-CN: "API Key（可选）", en-US: "API Key (optional)" }
      type: password
