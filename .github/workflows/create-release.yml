name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName' || echo "")
          NOTES_FLAG="--generate-notes"
          if [ -n "$PREV_TAG" ]; then
            NOTES_FLAG="--generate-notes --notes-start-tag $PREV_TAG"
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Yao v${VERSION}" \
            $NOTES_FLAG \
            --draft
