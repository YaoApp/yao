# Node Token - Node token lifecycle management
# namespace: auth
# resource: node_tokens
# actions: rotate, revoke
# levels: own, team, all

# ============ Owner ============

auth:node_tokens:rotate:own:
  owner: true
  description: "Rotate the node token owned by the current user"
  endpoints:
    - POST /auth/node-tokens/rotate

auth:node_tokens:revoke:own:
  owner: true
  description: "Revoke the node token owned by the current user"
  endpoints:
    - DELETE /auth/node-tokens/:jti

# ============ Team ============

auth:node_tokens:rotate:team:
  team: true
  description: "Rotate a team-owned node token"
  endpoints:
    - POST /auth/node-tokens/rotate

auth:node_tokens:revoke:team:
  team: true
  description: "Revoke a team-owned node token"
  endpoints:
    - DELETE /auth/node-tokens/:jti

# ============ All ============

auth:node_tokens:rotate:all:
  description: "Rotate any node token"
  endpoints:
    - POST /auth/node-tokens/rotate

auth:node_tokens:revoke:all:
  description: "Revoke any node token"
  endpoints:
    - DELETE /auth/node-tokens/:jti
